services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge_inbox
      POSTGRES_USER: knowledge_inbox
      POSTGRES_PASSWORD: knowledge_inbox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_inbox -d knowledge_inbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
